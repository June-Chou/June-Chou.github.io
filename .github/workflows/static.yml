<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Chooser Pro</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tag-enter-active, .tag-leave-active { transition: all 0.3s ease; }
        .tag-enter-from, .tag-leave-to { opacity: 0; transform: translateY(10px); }
        canvas { transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .scale-in { animation: scaleIn 0.3s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body :class="['min-h-screen pb-12 transition-colors duration-500', themeClass]" :style="{ backgroundColor: primaryHex + '05' }">
    <div id="app" class="max-w-md mx-auto p-4">
        
        <div class="flex flex-col gap-4 mb-8 bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center">
                <select v-model="currentScene" @change="resetAndLoad" class="bg-gray-50 border-none rounded-xl px-3 py-1.5 text-sm font-bold outline-none focus:ring-2" :style="{ '--tw-ring-color': primaryHex }">
                    <option value="food">{{ t('sceneFood') }}</option>
                    <option value="sport">{{ t('sceneSport') }}</option>
                    <option value="movie">{{ t('sceneMovie') }}</option>
                    <option value="custom">{{ t('sceneCustom') }}</option>
                </select>
                <div class="flex items-center gap-3">
                    <button @click="isRainbow = !isRainbow" class="text-[10px] font-bold px-2 py-1 rounded-md border transition-all" :style="{ borderColor: primaryHex, color: isRainbow ? '#fff' : primaryHex, backgroundColor: isRainbow ? primaryHex : 'transparent' }">
                        {{ isRainbow ? 'RAINBOW' : 'MONO' }}
                    </button>
                    <button @click="toggleLang" class="text-xs font-black hover:opacity-60">{{ lang === 'zh' ? 'EN' : '中文' }}</button>
                </div>
            </div>
            
            <div class="flex justify-between items-center border-t pt-3">
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Theme Color</span>
                <div class="flex gap-2">
                    <button v-for="(hex, name) in themes" :key="name" 
                        @click="currentTheme = name"
                        :class="['w-5 h-5 rounded-full transition-transform', currentTheme === name ? 'scale-125 ring-2 ring-offset-2 ring-gray-400' : 'hover:scale-110']"
                        :style="{ backgroundColor: hex }"></button>
                </div>
            </div>
        </div>

        <header class="text-center mb-6">
            <h1 class="text-4xl font-black italic tracking-tighter" :style="{ color: primaryHex }">{{ t('title') }}</h1>
        </header>

        <section class="relative flex flex-col items-center mb-10">
            <div class="relative w-72 h-72">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-10">
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[24px] drop-shadow-md" :style="{ borderTopColor: primaryHex }"></div>
                </div>
                <canvas ref="wheelCanvas" width="600" height="600" class="w-full h-full rounded-full border-[6px] border-white shadow-2xl bg-white"></canvas>
            </div>
            
            <button @click="spinWheel" :disabled="isSpinning || cuisineList.length === 0" 
                class="mt-10 px-16 py-4 text-white font-black rounded-full shadow-xl transform active:scale-95 transition-all text-xl disabled:bg-gray-300"
                :style="{ backgroundColor: primaryHex }">
                {{ isSpinning ? t('spinning') : t('spinBtn') }}
            </button>
        </section>

        <div v-if="showResult" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-6">
            <div class="bg-white rounded-[2.5rem] p-10 w-full max-w-xs text-center shadow-2xl scale-in border-b-[8px]" :style="{ borderColor: primaryHex }">
                <p class="text-gray-400 text-[10px] mb-2 font-black uppercase tracking-widest">{{ t('resultPrefix') }}</p>
                <h2 class="text-4xl font-black mb-10 tracking-tight" :style="{ color: primaryHex }">{{ selectedCuisine }}</h2>
                <button @click="showResult = false" class="w-full py-4 rounded-2xl font-black text-white shadow-lg active:scale-95 transition-transform" :style="{ backgroundColor: primaryHex }">
                    {{ t('confirmBtn') }}
                </button>
            </div>
        </div>

        <section class="bg-white rounded-[2rem] p-6 shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-5 px-1">
                <h3 class="font-black text-gray-800 text-xs uppercase tracking-widest">{{ t('listTitle') }}</h3>
                <div class="flex gap-4">
                    <button v-if="currentScene !== 'custom'" @click="refreshPool" class="text-xs font-black underline underline-offset-4" :style="{ color: primaryHex }">
                        {{ t('refreshBtn') }}
                    </button>
                    <button @click="clearCuisines" class="text-xs text-gray-300 hover:text-red-400 font-bold uppercase">{{ t('clearAll') }}</button>
                </div>
            </div>

            <div class="flex gap-2 mb-6">
                <input v-model="newCuisine" @keyup.enter="addCuisine" type="text" :placeholder="t('placeholder')" 
                    class="flex-1 px-5 py-3 bg-gray-50 rounded-2xl focus:outline-none focus:ring-2 text-sm transition-all" :style="{ '--tw-ring-color': primaryHex }">
                <button @click="addCuisine" class="bg-gray-900 text-white px-6 py-3 rounded-2xl text-xs font-black active:scale-90 transition-transform uppercase">{{ t('addBtn') }}</button>
            </div>

            <div class="flex flex-wrap gap-2 max-h-48 overflow-y-auto">
                <transition-group name="tag">
                    <span v-for="(item, index) in cuisineList" :key="item" 
                        class="px-4 py-2 rounded-xl text-[11px] flex items-center font-black border transition-all"
                        :style="{ backgroundColor: primaryHex + '08', color: primaryHex, borderColor: primaryHex + '20' }">
                        {{ item }}
                        <button @click="removeCuisine(index)" class="ml-2 hover:opacity-40 text-sm">×</button>
                    </span>
                </transition-group>
            </div>
        </section>

        <section class="mt-8 px-2">
            <h3 class="text-center font-black text-gray-300 text-[10px] uppercase tracking-[0.3em] mb-4">{{ t('historyTitle') }}</h3>
            <div class="grid grid-cols-1 gap-2">
                <div v-for="(h, i) in history" :key="i" class="flex justify-between items-center bg-white/50 p-4 rounded-2xl border border-white">
                    <span class="text-gray-700 font-bold text-sm">{{ h.name }}</span>
                    <span class="text-[9px] text-gray-400 font-mono italic">{{ h.time }}</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        const i18n = {
            zh: {
                title: "PICKER PRO", spinBtn: "GO!", spinning: "WAIT...",
                resultPrefix: "The Winner Is", confirmBtn: "GET IT", listTitle: "Options", addBtn: "Add",
                clearAll: "Clear", placeholder: "Enter items...", refreshBtn: "Shuffle",
                historyTitle: "Decision Log", sceneFood: "Takeout", sceneSport: "Workout", sceneMovie: "Movies", sceneCustom: "Custom"
            },
            en: {
                title: "PICKER PRO", spinBtn: "GO!", spinning: "WAIT...",
                resultPrefix: "The Winner Is", confirmBtn: "GET IT", listTitle: "Options", addBtn: "Add",
                clearAll: "Clear", placeholder: "Enter items...", refreshBtn: "Shuffle",
                historyTitle: "Decision Log", sceneFood: "Takeout", sceneSport: "Workout", sceneMovie: "Movies", sceneCustom: "Custom"
            }
        };

        const pool = {
            food: { zh: ["火锅", "烧烤", "川菜", "汉堡", "寿司", "拉面", "麻辣烫", "螺蛳粉", "沙拉", "披萨", "韩国料理", "泰国菜"], en: ["Hotpot", "BBQ", "Sichuan", "Burger", "Sushi", "Ramen", "Malatang", "Noodles", "Salad", "Pizza", "Korean", "Thai"] },
            sport: { zh: ["慢跑", "深蹲", "俯卧撑", "平板支撑", "波比跳", "开合跳", "引体向上", "卷腹"], en: ["Jogging", "Squat", "Push-up", "Plank", "Burpees", "Jump Jack", "Pull-up", "Crunch"] },
            movie: { zh: ["喜剧", "科幻", "恐怖", "动作", "爱情", "剧情", "纪录片", "悬疑"], en: ["Comedy", "Sci-Fi", "Horror", "Action", "Romance", "Drama", "Doc", "Mystery"] }
        };

        createApp({
            setup() {
                const lang = ref(localStorage.getItem('lang_v5') || 'zh');
                const currentScene = ref('food');
                const currentTheme = ref(localStorage.getItem('theme_v5') || 'indigo');
                const isRainbow = ref(false);
                const cuisineList = ref([]);
                const history = ref(JSON.parse(localStorage.getItem('history_v5')) || []);
                const newCuisine = ref('');
                const isSpinning = ref(false);
                const showResult = ref(false);
                const selectedCuisine = ref('');
                const wheelCanvas = ref(null);
                let currentRotation = 0;

                const themes = { indigo: '#4f46e5', rose: '#e11d48', emerald: '#10b981', amber: '#f59e0b', violet: '#8b5cf6', cyan: '#06b6d4', slate: '#475569', orange: '#f97316' };
                const primaryHex = computed(() => themes[currentTheme.value]);
                const t = (key) => i18n[lang.value][key];

                const drawWheel = () => {
                    const canvas = wheelCanvas.value;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const len = cuisineList.value.length;
                    const radius = canvas.width / 2;
                    const arc = Math.PI * 2 / (len || 1);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    cuisineList.value.forEach((name, i) => {
                        ctx.save();
                        ctx.translate(radius, radius);
                        ctx.rotate(i * arc);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.arc(0, 0, radius - 10, 0, arc);
                        
                        // 核心视觉逻辑：单色渐变 vs 彩色
                        if (isRainbow.value) {
                            ctx.fillStyle = `hsl(${(i * 360 / len)}, 70%, 75%)`;
                        } else {
                            // 基于主题色的饱和度阶梯
                            const lightness = 85 - (i * (40 / len)); 
                            ctx.fillStyle = `hsl(${getHSL(primaryHex.value).h}, ${getHSL(primaryHex.value).s}%, ${lightness}%)`;
                        }
                        
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.rotate(arc / 2);
                        ctx.textAlign = "right";
                        ctx.fillStyle = isRainbow.value ? "#1e293b" : (i > len/2 ? "#fff" : "#1e293b");
                        ctx.font = "bold 22px sans-serif";
                        ctx.fillText(name, radius - 50, 10);
                        ctx.restore();
                    });
                };

                // 工具：Hex转HSL
                function getHSL(hex) {
                    let r = parseInt(hex.slice(1,3), 16) / 255, g = parseInt(hex.slice(3,5), 16) / 255, b = parseInt(hex.slice(5,7), 16) / 255;
                    let max = Math.max(r, g, b), min = Math.min(r, g, b), h, s, l = (max + min) / 2;
                    if(max == min) h = s = 0;
                    else {
                        let d = max - min;
                        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                        switch(max){
                            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                            case g: h = (b - r) / d + 2; break;
                            case b: h = (r - g) / d + 4; break;
                        }
                        h /= 6;
                    }
                    return { h: h * 360, s: s * 100, l: l * 100 };
                }

                const spinWheel = () => {
                    if (isSpinning.value || cuisineList.value.length === 0) return;
                    isSpinning.value = true;
                    const rotateDeg = Math.floor(Math.random() * 360) + 3600; 
                    currentRotation += rotateDeg;
                    wheelCanvas.value.style.transform = `rotate(${currentRotation}deg)`;
                    setTimeout(() => {
                        isSpinning.value = false;
                        const actualDeg = currentRotation % 360;
                        const arcDeg = 360 / cuisineList.value.length;
                        const index = Math.floor(((360 - (actualDeg % 360) + 270) % 360) / arcDeg);
                        selectedCuisine.value = cuisineList.value[index];
                        showResult.value = true;
                        const now = new Date();
                        const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                        history.value.unshift({ name: selectedCuisine.value, time: timeStr });
                        if (history.value.length > 5) history.value.pop();
                    }, 4000);
                };

                const toggleLang = () => {
                    const oldLang = lang.value;
                    lang.value = lang.value === 'zh' ? 'en' : 'zh';
                    cuisineList.value = cuisineList.value.map(item => {
                        if (currentScene.value === 'custom') return item;
                        const idx = pool[currentScene.value][oldLang].indexOf(item);
                        return idx !== -1 ? pool[currentScene.value][lang.value][idx] : item;
                    });
                };

                const refreshPool = () => {
                    if (currentScene.value === 'custom') return;
                    cuisineList.value = [...pool[currentScene.value][lang.value]].sort(() => 0.5 - Math.random()).slice(0, 8);
                };

                const resetAndLoad = () => currentScene.value === 'custom' ? cuisineList.value = [] : refreshPool();
                const addCuisine = () => {
                    const val = newCuisine.value.trim().replace(/，/g, ',');
                    if (!val) return;
                    val.split(',').forEach(i => { if(i.trim() && !cuisineList.value.includes(i.trim())) cuisineList.value.push(i.trim()); });
                    newCuisine.value = '';
                };

                watch([cuisineList, lang, currentTheme, isRainbow], () => drawWheel(), { deep: true });
                onMounted(() => { resetAndLoad(); drawWheel(); });

                return {
                    lang, currentScene, currentTheme, isRainbow, cuisineList, newCuisine, history, isSpinning, selectedCuisine, showResult,
                    wheelCanvas, t, toggleLang, resetAndLoad, refreshPool, addCuisine, spinWheel, themes, primaryHex,
                    removeCuisine: (i) => cuisineList.value.splice(i, 1),
                    clearCuisines: () => cuisineList.value = [],
                    clearHistory: () => history.value = []
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
